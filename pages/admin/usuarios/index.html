<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários — ServiceDesk COHAB</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../assets/css/base.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/pages/dashboard/index.html">
            <i class="bi bi-headset me-2 text-primary"></i>ServiceDesk COHAB
        </a>
        <div class="text-white d-flex align-items-center">
            <span class="me-2 small text-white-50">Logado como:</span>
            <span class="fw-bold me-3 text-info" id="navbar-username"></span>
            <span class="badge bg-danger shadow-sm px-3 py-2 d-none" id="navbar-badge-admin">
                <i class="bi bi-shield-lock-fill me-1"></i>ADMINISTRADOR
            </span>
            <a href="#" id="btn-logout" class="ms-3 btn btn-sm btn-outline-danger border-0 fw-bold">
                <i class="bi bi-box-arrow-right fs-5"></i>
            </a>
        </div>
    </div>
</nav>

<!-- Caixa de notificações -->
<div id="caixa-notificacoes" class="position-fixed top-0 end-0 p-3"
     style="z-index:1080; width:min(92vw,380px); pointer-events:none;"></div>

<main class="container">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/pages/dashboard/index.html" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h5 class="fw-bold mb-0">
            <i class="bi bi-people me-2 text-primary"></i>Usuários cadastrados
        </h5>
        <span class="badge bg-secondary ms-1 d-none" id="total-usuarios"></span>
    </div>

    <div id="mensagens"></div>

    <!-- Busca e filtros -->
    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-md">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="search" id="busca" class="form-control"
                               placeholder="Buscar por usuário, nome ou e-mail">
                    </div>
                </div>
                <div class="col-sm-6 col-md-auto">
                    <select id="filtro-perfil" class="form-select" aria-label="Filtrar por perfil">
                        <option value="">Todos os perfis</option>
                        <option value="administrador">Administradores</option>
                        <option value="cliente">Clientes</option>
                    </select>
                </div>
                <div class="col-sm-6 col-md-auto">
                    <select id="filtro-situacao" class="form-select" aria-label="Filtrar por situação">
                        <option value="">Todas as situações</option>
                        <option value="ativo">Ativos</option>
                        <option value="inativo">Inativos</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Lista -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4">Usuário</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Situação</th>
                            <th>Cadastrado em</th>
                            <th class="pe-4">Último acesso</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-usuarios">
                        <tr><td colspan="7" class="text-center py-4 text-muted">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../assets/js/base.js"></script>
<script type="module">
    import { requireAuth, preencherNavbar, isStaff, formatarData } from "../../../assets/js/auth.js";
    import { getUsuariosCadastrados } from "../../../assets/js/api.js";
    import "../../../assets/js/notificacoes.js";

    requireAuth();
    // Página restrita a administradores (staff/superuser); a API também valida no backend.
    if (!isStaff()) window.location.href = "/pages/dashboard/index.html";
    preencherNavbar();

    const tbody          = document.getElementById("tabela-usuarios");
    const total          = document.getElementById("total-usuarios");
    const busca          = document.getElementById("busca");
    const filtroPerfil   = document.getElementById("filtro-perfil");
    const filtroSituacao = document.getElementById("filtro-situacao");

    let usuarios = [];

    function escapar(texto) {
        const div = document.createElement("div");
        div.textContent = texto ?? "";
        return div.innerHTML;
    }

    function linha(u) {
        const perfil = u.perfil === "administrador"
            ? `<span class="badge bg-danger"><i class="bi bi-shield-lock-fill me-1"></i>Administrador</span>`
            : `<span class="badge bg-primary">Cliente</span>`;
        const situacao = u.is_active
            ? `<span class="badge bg-success">Ativo</span>`
            : `<span class="badge bg-secondary">Inativo</span>`;
        return `
            <tr>
                <td class="ps-4 fw-semibold">${escapar(u.username)}</td>
                <td>${escapar(u.nome) || '<span class="text-muted">—</span>'}</td>
                <td>${escapar(u.email) || '<span class="text-muted">—</span>'}</td>
                <td>${perfil}</td>
                <td>${situacao}</td>
                <td class="text-muted small">${formatarData(u.data_cadastro) || "—"}</td>
                <td class="text-muted small pe-4">${formatarData(u.ultimo_acesso) || "Nunca acessou"}</td>
            </tr>`;
    }

    function renderizar() {
        const termo = busca.value.trim().toLowerCase();
        const lista = usuarios.filter(u => {
            if (filtroPerfil.value && u.perfil !== filtroPerfil.value) return false;
            if (filtroSituacao.value === "ativo" && !u.is_active) return false;
            if (filtroSituacao.value === "inativo" && u.is_active) return false;
            if (!termo) return true;
            return [u.username, u.nome, u.email].some(v => (v || "").toLowerCase().includes(termo));
        });

        total.textContent = lista.length === usuarios.length
            ? `${usuarios.length}`
            : `${lista.length} de ${usuarios.length}`;
        total.classList.remove("d-none");

        tbody.innerHTML = lista.length
            ? lista.map(linha).join("")
            : `<tr><td colspan="7" class="text-center py-4 text-muted">Nenhum usuário encontrado.</td></tr>`;
    }

    async function carregar() {
        try {
            usuarios = await getUsuariosCadastrados() ?? [];
            renderizar();
        } catch (err) {
            const msg = err.isNetworkError ? err.message : "Erro ao carregar usuários.";
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">${escapar(msg)}</td></tr>`;
        }
    }

    busca.addEventListener("input", renderizar);
    filtroPerfil.addEventListener("change", renderizar);
    filtroSituacao.addEventListener("change", renderizar);

    carregar();
</script>

</body>
</html>
