<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorias — ServiceDesk Facul</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../assets/css/base.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/pages/dashboard/index.html">
            <i class="bi bi-headset me-2 text-primary"></i>ServiceDesk Facul
        </a>
        <div class="text-white d-flex align-items-center">
            <span class="me-2 small text-white-50">Logado como:</span>
            <span class="fw-bold me-3 text-info" id="navbar-username"></span>
            <span class="badge bg-danger shadow-sm px-3 py-2 d-none" id="navbar-badge-admin">
                <i class="bi bi-shield-lock-fill me-1"></i>ADMINISTRADOR
            </span>
            <a href="#" id="btn-logout" class="ms-3 btn btn-sm btn-outline-danger border-0 fw-bold">
                <i class="bi bi-box-arrow-right fs-5"></i>
            </a>
        </div>
    </div>
</nav>

<!-- Caixa de notificações -->
<div id="caixa-notificacoes" class="position-fixed top-0 end-0 p-3"
     style="z-index:1080; width:min(92vw,380px); pointer-events:none;"></div>

<main class="container">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/pages/admin/index.html" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h5 class="fw-bold mb-0">
            <i class="bi bi-tags me-2 text-primary"></i>Categorias de chamado
        </h5>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div id="mensagens"></div>

            <!-- Nova categoria -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">
                    <form id="form-nova" class="row g-2 align-items-end" novalidate>
                        <div class="col-sm">
                            <label for="id_nome" class="form-label fw-semibold">Nova categoria</label>
                            <input type="text" id="id_nome" class="form-control" maxlength="50"
                                   placeholder="Ex.: Impressora" required>
                        </div>
                        <div class="col-sm-auto">
                            <button type="submit" class="btn btn-primary fw-bold px-4 w-100">
                                <i class="bi bi-plus-lg me-1"></i>Adicionar
                            </button>
                        </div>
                    </form>
                    <p class="text-muted small mb-0 mt-2">
                        Categorias inativas não aparecem na abertura de chamados, mas continuam nos chamados antigos.
                    </p>
                </div>
            </div>

            <!-- Lista -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-4">Nome</th>
                                    <th>Chamados</th>
                                    <th>Situação</th>
                                    <th class="text-end pe-4">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-categorias">
                                <tr><td colspan="4" class="text-center py-4 text-muted">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../assets/js/base.js"></script>
<script type="module">
    import { requireAuth, preencherNavbar, isStaff, mostrarAlerta } from "../../../assets/js/auth.js";
    import { getCategorias, criarCategoria, atualizarCategoria, excluirCategoria } from "../../../assets/js/api.js";
    import "../../../assets/js/notificacoes.js";

    requireAuth();
    // Página restrita a administradores (staff/superuser); a API também valida no backend.
    if (!isStaff()) window.location.href = "/pages/dashboard/index.html";
    preencherNavbar();

    const tbody = document.getElementById("tabela-categorias");
    const msgs  = document.getElementById("mensagens");
    const form  = document.getElementById("form-nova");
    const input = document.getElementById("id_nome");

    let categorias = [];

    function escapar(texto) {
        const div = document.createElement("div");
        div.textContent = texto;
        return div.innerHTML;
    }

    function mensagemDeErro(err, padrao) {
        if (err.isNetworkError) return err.message;
        const erros = err.data || {};
        return Object.values(erros).flat().join(" ") || padrao;
    }

    function linha(c) {
        const situacao = c.ativa
            ? `<span class="badge bg-success">Ativa</span>`
            : `<span class="badge bg-secondary">Inativa</span>`;
        // Categoria com chamados não pode ser excluída, apenas desativada.
        const podeExcluir = c.total_chamados === 0;
        return `
            <tr data-id="${c.id}">
                <td class="ps-4">
                    <span class="fw-semibold js-nome">${escapar(c.nome)}</span>
                    <form class="js-form-editar d-none d-flex gap-2">
                        <input type="text" class="form-control form-control-sm" maxlength="50" value="${escapar(c.nome)}" required>
                        <button type="submit" class="btn btn-sm btn-primary" title="Salvar"><i class="bi bi-check-lg"></i></button>
                        <button type="button" class="btn btn-sm btn-outline-secondary js-cancelar" title="Cancelar"><i class="bi bi-x-lg"></i></button>
                    </form>
                </td>
                <td>${c.total_chamados}</td>
                <td>${situacao}</td>
                <td class="text-end pe-4 text-nowrap">
                    <button class="btn btn-sm btn-outline-secondary js-editar" title="Renomear">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm ${c.ativa ? "btn-outline-warning" : "btn-outline-success"} js-alternar"
                            title="${c.ativa ? "Desativar" : "Ativar"}">
                        <i class="bi ${c.ativa ? "bi-eye-slash" : "bi-eye"}"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger js-excluir" ${podeExcluir ? "" : "disabled"}
                            title="${podeExcluir ? "Excluir" : "Possui chamados — desative em vez de excluir"}">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>`;
    }

    function renderizar() {
        if (!categorias.length) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">Nenhuma categoria cadastrada.</td></tr>`;
            return;
        }
        tbody.innerHTML = categorias.map(linha).join("");
    }

    async function carregar() {
        try {
            categorias = await getCategorias({ todas: true }) ?? [];
            renderizar();
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger">${escapar(mensagemDeErro(err, "Erro ao carregar categorias."))}</td></tr>`;
        }
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msgs.innerHTML = "";
        const nome = input.value.trim();
        if (!nome) return;
        try {
            await criarCategoria({ nome });
            input.value = "";
            mostrarAlerta(msgs, `Categoria <strong>${escapar(nome)}</strong> adicionada.`, "success");
            await carregar();
        } catch (err) {
            mostrarAlerta(msgs, escapar(mensagemDeErro(err, "Erro ao adicionar categoria.")), "danger");
        }
    });

    tbody.addEventListener("click", async (e) => {
        const tr = e.target.closest("tr[data-id]");
        if (!tr) return;
        const categoria = categorias.find(c => c.id === Number(tr.dataset.id));
        const formEditar = tr.querySelector(".js-form-editar");
        const nomeEl = tr.querySelector(".js-nome");

        if (e.target.closest(".js-editar")) {
            nomeEl.classList.add("d-none");
            formEditar.classList.remove("d-none");
            formEditar.querySelector("input").focus();
        } else if (e.target.closest(".js-cancelar")) {
            formEditar.classList.add("d-none");
            nomeEl.classList.remove("d-none");
        } else if (e.target.closest(".js-alternar")) {
            msgs.innerHTML = "";
            try {
                await atualizarCategoria(categoria.id, { ativa: !categoria.ativa });
                await carregar();
            } catch (err) {
                mostrarAlerta(msgs, escapar(mensagemDeErro(err, "Erro ao atualizar categoria.")), "danger");
            }
        } else if (e.target.closest(".js-excluir")) {
            msgs.innerHTML = "";
            if (!confirm(`Excluir a categoria "${categoria.nome}"?`)) return;
            try {
                await excluirCategoria(categoria.id);
                mostrarAlerta(msgs, `Categoria <strong>${escapar(categoria.nome)}</strong> excluída.`, "success");
                await carregar();
            } catch (err) {
                mostrarAlerta(msgs, escapar(mensagemDeErro(err, "Erro ao excluir categoria.")), "danger");
            }
        }
    });

    tbody.addEventListener("submit", async (e) => {
        const formEditar = e.target.closest(".js-form-editar");
        if (!formEditar) return;
        e.preventDefault();
        msgs.innerHTML = "";
        const id = Number(formEditar.closest("tr").dataset.id);
        const nome = formEditar.querySelector("input").value.trim();
        if (!nome) return;
        try {
            await atualizarCategoria(id, { nome });
            await carregar();
        } catch (err) {
            mostrarAlerta(msgs, escapar(mensagemDeErro(err, "Erro ao renomear categoria.")), "danger");
        }
    });

    carregar();
</script>

</body>
</html>
