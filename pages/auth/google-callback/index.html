<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Google — ServiceDesk Facul</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../assets/css/base.css">
    <link rel="stylesheet" href="../../../assets/css/auth.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card auth-card--login card p-4 p-sm-5 text-center">
        <i class="bi bi-google fs-1 text-danger"></i>
        <h4 class="fw-bold mt-3 mb-2">Conectando sua conta</h4>
        <p class="text-muted small mb-0">Aguarde enquanto finalizamos o login.</p>
        <div class="spinner-border text-primary mt-4" role="status" aria-label="Carregando"></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.hash.slice(1));
    const access = params.get("access");
    const refresh = params.get("refresh");
    const user = params.get("user");

    if (access && refresh && user) {
        localStorage.setItem("sd_access_token", access);
        localStorage.setItem("sd_refresh_token", refresh);
        localStorage.setItem("sd_user", user);
        window.history.replaceState(null, "", window.location.pathname);
        window.location.href = "/pages/dashboard/index.html";
    } else {
        localStorage.clear();
        window.location.href = "/pages/login/index.html?google_error=1";
    }
</script>

</body>
</html>
